<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trò Chơi Vui - Thiên Văn Học</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="theme-color" content="#0284C7">
  <meta name="description" content="Nền tảng trò chơi giáo dục tương tác - Thiên văn học: Khám phá Hệ Mặt Trời, vũ trụ và các hiện tượng nhật thực nguyệt thực">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #F0F9FF, #FEF9C3 35%, #FDF2F8 70%, #F0FDF4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .wave-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      overflow: hidden;
    }
    .wave-bg::before, .wave-bg::after {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(2,132,199,0.08) 0%, transparent 70%);
      animation: waveMove 20s ease-in-out infinite;
    }
    .wave-bg::after {
      animation-delay: -10s;
      opacity: 0.5;
    }
    @keyframes waveMove {
      0%, 100% { transform: translate(-10%, -10%) rotate(0deg); }
      50% { transform: translate(10%, 10%) rotate(5deg); }
    }
    .loader {
      text-align: center;
      animation: fadeInUp 0.6s ease-out;
    }
    .loader-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: float 2s ease-in-out infinite;
    }
    .loader-text {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 800;
      color: #0284C7;
    }
    .loader-sub {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: #64748B;
      margin-top: 10px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="wave-bg"></div>
  <div class="loader">
    <div class="loader-icon">🌌</div>
    <div class="loader-text">Trò Chơi Vui</div>
    <div class="loader-sub">Đang tải thiên văn học...</div>
  </div>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.error('SW registration failed:', err));
    }
    // Redirect to game library after short delay
    setTimeout(() => {
      window.location.href = 'games/index.html';
    }, 1500);
  </script>
</body>
</html>
